project_id = "flyee-club-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "512MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

# The auth e-mails (confirmation, password recovery, e-mail change), in both
# languages. They are rendered by Supabase Auth, not by the app; the hosted
# project gets the same files pasted in its dashboard (docs/DEPLOY.md). E-mail
# confirmation stays off locally, where there is no inbox to read it from.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no flyee.club / Confirm your email at flyee.club"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha do flyee.club / Reset your flyee.club password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail no flyee.club / Confirm your new email at flyee.club"
content_path = "./supabase/templates/email_change.html"

[analytics]
enabled = false
