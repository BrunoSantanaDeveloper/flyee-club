project_id = "flyee-club-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "512MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

# The auth e-mails (confirmation, password recovery, e-mail change), in both
# languages. They are sent by Supabase Auth, not by the app, and rendered from
# packages/email (npm run supabase:templates -w @flyee/email, which also checks
# these subjects). The subject is a template too: the account's locale picks
# the language. The hosted project gets the same files and subjects pasted in
# its dashboard (docs/DEPLOY.md). E-mail confirmation stays off locally, where
# there is no inbox to read it from.
[auth.email.template.confirmation]
subject = '{{ if eq (printf "%v" .Data.locale) "en" }}Confirm your email at FlyeeClub{{ else }}Confirme seu e-mail no FlyeeClub{{ end }}'
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = '{{ if eq (printf "%v" .Data.locale) "en" }}Reset your FlyeeClub password{{ else }}Redefina sua senha do FlyeeClub{{ end }}'
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = '{{ if eq (printf "%v" .Data.locale) "en" }}Confirm your new email at FlyeeClub{{ else }}Confirme seu novo e-mail no FlyeeClub{{ end }}'
content_path = "./supabase/templates/email_change.html"

[analytics]
enabled = false
